<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ストレッチ図鑑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbfaf6; --ink:#1d1f22; --sub:#6b6e73; --line:#dcd9cf;
  --gold:#c99a12; --gold-soft:#f3e7c2; --card:#ffffff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#17181a; --ink:#ecebe6; --sub:#a3a49f; --line:#34363a; --gold:#e2b43a; --gold-soft:#3a3220; --card:#222326;}}
:root[data-theme="dark"]{--paper:#17181a; --ink:#ecebe6; --sub:#a3a49f; --line:#34363a; --gold:#e2b43a; --gold-soft:#3a3220; --card:#222326;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;line-height:1.6}
main{max-width:1040px;margin:0 auto;padding:28px 18px 56px}
header h1{font-size:clamp(2rem,7vw,3.2rem);font-weight:900;line-height:1.05;margin:0 0 .4rem;letter-spacing:.02em}
header h1 span{display:inline-block;border-bottom:6px solid var(--gold);padding-bottom:2px}
header p{margin:0;color:var(--sub);font-size:.95rem;max-width:36em}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);
  padding:14px 0 12px;margin-top:20px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.row+.row{margin-top:8px}
.row b{font-size:.8rem;color:var(--sub);align-self:center;white-space:nowrap;min-width:5.5em;font-weight:700}
.chip{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:6px 14px;border-radius:999px;white-space:nowrap;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip:focus-visible,.img:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:20px}
.card{margin:0;background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.card[hidden]{display:none}
.img{all:unset;cursor:zoom-in;display:block;background:#fff;aspect-ratio:1/1;padding:8px}
.img img{width:100%;height:100%;object-fit:contain;display:block}
figcaption{padding:8px 10px 10px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.name{font-weight:700;font-size:.92rem;line-height:1.3}
.part{font-size:.72rem;color:var(--sub);white-space:nowrap}
.count{color:var(--sub);font-size:.85rem;margin-top:12px}
section.rules{margin-top:44px;background:var(--gold-soft);border-radius:6px;padding:20px 20px 8px}
section.rules h2{margin:0 0 10px;font-size:1.15rem}
section.rules ol{margin:0;padding-left:1.3em}
section.rules li{margin-bottom:10px;max-width:40em}
dialog{border:none;padding:0;background:transparent;max-width:min(92vw,560px);width:100%}
dialog::backdrop{background:rgba(0,0,0,.72)}
.zoom{background:#fff;border-radius:8px;overflow:hidden}
.zoom img{width:100%;display:block}
.zoom p{margin:0;padding:12px 16px;background:var(--card);color:var(--ink);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.zoom button{font:inherit;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:4px 14px;cursor:pointer}
footer{margin-top:28px;color:var(--sub);font-size:.8rem}
</style>
</head>
<body>
<main>
<header>
  <h1><span>ストレッチ図鑑</span></h1>
  <p>ゴールドジムのスタティック・ストレッチ20種。トレーニングの日や部位で絞り込み、絵をタップすると大きく表示します。</p>
</header>
<nav aria-label="絞り込み">
  <div class="row" id="byDay"><b>トレーニング</b>
    <button class="chip" data-f="all" aria-pressed="true">すべて</button>
    <button class="chip" data-f="t:押す">押す日（胸・肩・三頭）</button>
    <button class="chip" data-f="t:引く">引く日（背中・二頭）</button>
    <button class="chip" data-f="t:脚">脚の日</button>
    <button class="chip" data-f="t:毎日">毎日・デスクワーク後</button>
  </div>
  <div class="row" id="byPart"><b>部位</b>
    <button class="chip" data-f="g:首・肩">首・肩</button>
    <button class="chip" data-f="g:上半身">上半身</button>
    <button class="chip" data-f="g:体幹">体幹</button>
    <button class="chip" data-f="g:下半身">下半身</button>
  </div>
</nav>
<p class="count" id="count"></p>
<div class="grid" id="grid">
<figure class="card" data-g="下半身" data-t="脚" id="hip">

<section class="rules">
  <h2>やるときの注意点</h2>
  <ol>
    <li>息を止めずに、ゆっくり呼吸する。伸ばしながら吐き、伸ばした姿勢を保ったまま吸う。</li>
    <li>張りを感じるところで止め、その張りが消えるまで保つ。痛いところまでは伸ばさない。</li>
    <li>反動は使わない。</li>
    <li>伸ばしている筋肉を意識する。</li>
    <li>左右の柔らかさに差があるとケガにつながるので、両側が同じくらい伸びるようにする。</li>
  </ol>
</section>
<footer>出典：ゴールドジム配布のストレッチ説明書（個人用）</footer>
</main>
<dialog id="dlg"><div class="zoom"><img id="dimg" alt=""><p><span id="dname"></span><button id="dclose">閉じる</button></p></div></dialog>
<script>
(function(){
  var cards=[].slice.call(document.querySelectorAll('.card'));
  var chips=[].slice.call(document.querySelectorAll('.chip'));
  var count=document.getElementById('count');
  function apply(f){
    var n=0;
    cards.forEach(function(c){
      var ok=f==='all'||(f.indexOf('t:')===0&&(' '+c.dataset.t+' ').indexOf(' '+f.slice(2)+' ')>=0)||(f.indexOf('g:')===0&&c.dataset.g===f.slice(2));
      c.hidden=!ok; if(ok)n++;
    });
    count.textContent=n+'種類を表示中';
    chips.forEach(function(ch){ch.setAttribute('aria-pressed',String(ch.dataset.f===f));});
    try{localStorage.setItem('stretch-filter',f);}catch(e){}
  }
  chips.forEach(function(ch){ch.addEventListener('click',function(){apply(ch.dataset.f);});});
  var saved='all'; try{saved=localStorage.getItem('stretch-filter')||'all';}catch(e){}
  if(location.hash){var t=document.querySelector(location.hash); if(t){saved='all';}}
  apply(saved);
  if(location.hash){var t2=document.querySelector(location.hash); if(t2){t2.scrollIntoView();t2.style.outline='3px solid var(--gold)';}}
  var dlg=document.getElementById('dlg');
  cards.forEach(function(c){c.querySelector('.img').addEventListener('click',function(){
    document.getElementById('dimg').src=c.querySelector('img').src;
    document.getElementById('dimg').alt=c.querySelector('img').alt;
    document.getElementById('dname').textContent=c.querySelector('.name').textContent;
    if(dlg.showModal)dlg.showModal();
  });});
  document.getElementById('dclose').addEventListener('click',function(){dlg.close();});
  dlg.addEventListener('click',function(e){if(e.target===dlg)dlg.close();});
})();
</script>
</body>
</html>
