<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A商店 業務フロー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 和紙色の地に紺の帯。業務タブ → 縦=手順・横=担当者のスイムレーン。スマホは手順リストに切替 */
:root{
  --bg:#fbf8f1; --paper:#ffffff; --ink:#1f2433; --muted:#6b6f7c; --line:#e3ddcf; --stripe:#f4efe3;
  --navy:#233a6e; --navy-ink:#ffffff; --shu:#e0662a;
  --l-cust:#5d7287; --l-pres:#233a6e; --l-vp:#b8432f; --l-office:#2f6b4f; --l-tech:#8a6a32; --l-part:#b98a12; --l-sup:#6a5d8f;
  --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14161d; --paper:#1d2029; --ink:#ebe7dc; --muted:#9a9cab; --line:#30333f; --stripe:#191c24;
  --navy:#8fa6dc; --navy-ink:#11141c; --shu:#f08a52;
  --l-cust:#93a8bd; --l-pres:#8fa6dc; --l-vp:#e7836d; --l-office:#6fbf96; --l-tech:#cfa964; --l-part:#e3bb48; --l-sup:#a99bd6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14161d; --paper:#1d2029; --ink:#ebe7dc; --muted:#9a9cab; --line:#30333f; --stripe:#191c24;
  --navy:#8fa6dc; --navy-ink:#11141c; --shu:#f08a52;
  --l-cust:#93a8bd; --l-pres:#8fa6dc; --l-vp:#e7836d; --l-office:#6fbf96; --l-tech:#cfa964; --l-part:#e3bb48; --l-sup:#a99bd6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.35}
header.top{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between;border-bottom:3px solid var(--navy);padding-bottom:16px}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--muted)}
h1{font-size:clamp(26px,5vw,38px);color:var(--ink)}
.lead{color:var(--muted);max-width:62ch;margin:6px 0 0}
.sample{display:inline-block;font-size:12px;border:1px solid var(--shu);color:var(--shu);padding:1px 8px;border-radius:3px;letter-spacing:.06em;margin-left:6px;vertical-align:middle;font-family:var(--body)}
.umbrellas{display:flex;gap:6px}
.umbrellas figure{margin:0;width:88px;text-align:center;font-size:11px;color:var(--muted)}
.umbrellas img{width:88px;height:80px;object-fit:contain;background:#fff;border-radius:6px;display:block}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;padding-block:12px;margin-top:4px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:500 14px var(--body);padding:8px 14px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.tab:focus-visible,.btn:focus-visible,.jump:focus-visible{outline:2px solid var(--shu);outline-offset:2px}

.panel-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin:10px 0 14px}
.panel-head h2{font-size:24px}
.panel-head p{margin:4px 0 0;color:var(--muted);max-width:66ch}
.viewsw{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.btn{border:0;background:var(--paper);color:var(--ink);font:500 13px var(--body);padding:6px 12px;cursor:pointer}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-bottom:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:2px;display:inline-block}

/* ---- matrix ---- */
.scroller{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.matrix{position:relative;display:grid;grid-template-columns:44px repeat(7,minmax(128px,1fr));min-width:980px}
.mh{position:sticky;top:0;font:700 13px var(--body);text-align:center;padding:10px 4px 8px;border-bottom:2px solid var(--line);background:var(--paper);z-index:2}
.mh small{display:block;font-weight:400;color:var(--muted);font-size:11px;line-height:1.3}
.mh .bar{height:4px;border-radius:2px;margin:0 10px 6px}
.cell{border-left:1px dashed var(--line);padding:9px 7px;min-height:20px;position:relative}
.cell.alt{background:var(--stripe)}
.num{font:600 13px var(--display);color:var(--muted);text-align:center;padding-top:16px;font-variant-numeric:tabular-nums}
.phase{grid-column:1/-1;font:700 12px var(--body);letter-spacing:.12em;color:var(--navy);padding:10px 12px 4px;border-top:1px solid var(--line);background:var(--paper)}
.card{position:relative;z-index:1;background:var(--paper);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:6px;padding:8px 9px;font-size:13px;line-height:1.55}
.card b{display:block;font-size:13.5px}
.card p{margin:3px 0 0;color:var(--muted);font-size:12px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:10.5px;padding:0 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted);line-height:18px}
.tag.part{border-color:var(--l-part);color:var(--l-part)}
.tag.check{border-color:var(--shu);color:var(--shu)}
.branch{margin-top:6px;font-size:11.5px;border-left:2px solid var(--shu);padding-left:6px;color:var(--ink)}
.jump{background:none;border:0;padding:0;color:var(--navy);text-decoration:underline;font:inherit;cursor:pointer}
.matrix.ov{grid-template-columns:36px repeat(7,minmax(104px,1fr));min-width:820px}
.matrix.ov .cell{padding:7px 6px}
.matrix.ov .num{padding-top:12px;font-size:12px}
.ovgroup{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;padding:14px 12px 6px;border-top:2px solid var(--line);background:var(--paper);position:relative;z-index:1}
.ovgroup span{font:800 16px var(--display)}
.ovgroup .jump{font-size:12px}
.node{position:relative;z-index:1;display:flex;gap:6px;align-items:center;background:var(--paper);border:1.5px solid var(--c);border-radius:6px;padding:5px 7px;font-size:12px;line-height:1.4;font-weight:500}
.node b{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--c);color:var(--paper);display:grid;place-items:center;font:700 11px var(--body);font-variant-numeric:tabular-nums}
svg.links{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:visible}
svg.links path{fill:none;stroke:var(--muted);stroke-width:1.4;opacity:.55}
svg.links .head{fill:var(--muted);stroke:none;opacity:.7}

/* ---- list ---- */
.list{display:grid;gap:0;max-width:720px}
.li{display:grid;grid-template-columns:34px 1fr;gap:10px;position:relative;padding-bottom:12px}
.li::before{content:"";position:absolute;left:16px;top:30px;bottom:0;width:2px;background:var(--line)}
.li:last-child::before{display:none}
.li .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--paper);border:2px solid var(--c);font:700 14px var(--display);color:var(--ink);z-index:1;font-variant-numeric:tabular-nums}
.li .card{border-top-width:1px;border-left:4px solid var(--c)}
.who{display:inline-block;font-size:11.5px;font-weight:700;color:var(--c);letter-spacing:.04em}
.handoff{font-size:11px;color:var(--shu);margin-left:6px}
.lphase{font:700 12px var(--body);letter-spacing:.12em;color:var(--navy);padding:8px 0 8px 44px}

/* ---- overview ---- */
.ov-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-bottom:22px}
.biz{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.biz h3{font-size:18px}
.biz p{margin:0;color:var(--muted);font-size:13.5px}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:12px;margin-top:4px}
.chain span.s{padding:1px 7px;border-radius:3px;background:var(--stripe);border:1px solid var(--line)}
.chain i{font-style:normal;color:var(--muted)}
.biz .go{align-self:flex-start;margin-top:6px}
table.raci{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}
.raci th,.raci td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:center}
.raci th:first-child,.raci td:first-child{text-align:left;font-weight:700}
.raci thead th{font-size:12px;border-bottom:2px solid var(--line)}
.raci .m{font-size:18px;line-height:1}
.raci .main{color:var(--navy)}
.raci .sub{color:var(--muted)}
.raci td small{display:block;font-size:10.5px;color:var(--muted);line-height:1.3}
h3.sec{font-size:18px;margin:4px 0 10px}

.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:22px}
.note{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 16px}
.note h4{margin:0 0 6px;font:700 14px var(--body)}
.note ul{margin:0;padding-left:1.2em;font-size:13.5px}
.note li{margin:2px 0}
.note.ask{border-color:var(--shu)}
.note.ask h4{color:var(--shu)}
footer{margin-top:28px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
footer a{color:var(--navy)}
@media (max-width:640px){.umbrellas figure{width:72px}.umbrellas img{width:72px;height:66px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

</head>
<body>
<div class="wrap">
<header class="top">
  <div>
    <div class="eyebrow">A商店　社内向け資料</div>

 kasa:["実際の組み立て・仕上げの工程と、各工程の担当","1本あたりにかかる日数（乾燥・天日干しを含む）","見込みで作る本数の基準と、受注生産に切り替える目安","完成品の検品で見る項目と担当","骨以外に、海外や外部から仕入れる部品があるか"],

 matsuri:["問い合わせの入口（電話・メール）と、最初に受ける人","見積書の作り方（単価表の有無）","特注・名入れの有無と、納期の目安","請求のタイミング（納品前・納品後）","毎年決まった時期の受注があるか"],

 {name:"番傘・野点傘の製造",id:"kasa",m:{cust:"",pres:"",vp:"main",office:"",tech:"main",part:"sub",sup:"sub"},n:{vp:"計画・検品",tech:"組立・仕上げ"}},

 {name:"祭り・団体受注",id:"matsuri",m:{cust:"main",pres:"",vp:"main",office:"main",tech:"sub",part:"sub",sup:""},n:{vp:"見積・判断",office:"受付・請求"}},
 {name:"在庫・棚卸",id:"stock",m:{cust:"",pres:"sub",vp:"sub",office:"main",tech:"sub",part:"main",sup:""},n:{part:"Excel入力",office:"棚卸・報告"}},
 {name:"請求書の発行・入金確認",id:"matsuri",m:{cust:"sub",pres:"",vp:"",office:"main",tech:"",part:"",sup:""},n:{office:"全業務"}}

const OV_FLOW={
 chasen:[["office","在庫を確認"],["pres","仕入先へ発注"],["sup","生産・出荷"],["vp","通関・検品"],["part","入庫を入力"],["cust","電話で注文"],["pres","注文を受ける"],["part","受注を入力"],["office","発送・請求書"],["cust","支払い"],["office","入金確認"]],
 kasa:[["vp","生産計画・骨を発注"],["sup","骨の製作・出荷"],["vp","通関・検品"],["part","部品入庫を入力"],["tech","組立・紙張り・油引き・仕上げ"],["vp","完成品の検品"],["part","製品在庫に登録"]],
 net:[["cust","サイトで注文"],["office","注文確認"],["part","受注を入力"],["cust","商品の問い合わせ"],["vp","問い合わせに回答"],["office","入金確認・包装・発送"],["part","出庫を入力"],["cust","受け取り"]],
 matsuri:[["cust","電話・メールで問い合わせ"],["office","受付・引き継ぎ"],["vp","聞き取り・見積書"],["cust","発注"],["part","受注を入力"],["vp","在庫か製作か判断"],["tech","製作・名入れ"],["vp","検品"],["office","発送・請求書"],["cust","支払い"],["office","入金確認"]],
 stock:[["part","入出庫を入力（毎日）"],["office","チェック・棚卸準備"],["tech","実物を数える（月1回）"],["part","差異を計算"],["office","原因確認・報告"],["pres","茶筅の発注判断"],["vp","骨・傘の生産判断",5]]

const ASKS={
 overview:["各業務を、実際にはどの順番で、誰が進めているか","事務スタッフ3名の分担（誰が受付・発送・請求を担当するか）","技術スタッフ2名の分担","アルバイトに任せる入力作業の範囲"],
};

let view=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function store(k,v){try{v===undefined?null:localStorage.setItem(k,v);return localStorage.getItem(k)}catch(e){return null}}

const TABS=[{id:"overview",tab:"全体図"},...FLOWS];
function renderTabs(cur){
 $("#tabs").innerHTML=TABS.map(t=>`<button class="tab" role="tab" id="tab-${t.id}" aria-selected="${t.id===cur}" data-t="${t.id}">${t.tab}</button>`).join("");
}
function legend(){
 return `<div class="legend">${LANES.map(l=>`<span><i class="dot" style="background:var(${l.c})"></i>${l.name}</span>`).join("")}<span><span class="tag part">バイト可</span>アルバイトに任せられる作業</span><span><span class="tag check">要確認</span>実態に合わせて直す箇所</span></div>`;
}
function cardHTML(s,f,inList){
 const l=L[s.l];
 const tags=(s.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")+(s.part?`<span class="tag part">バイト可</span>`:"")+(s.check?`<span class="tag check" title="${esc(s.check)}">要確認：${esc(s.check)}</span>`:"");
 const br=s.branch?`<div class="branch">${s.jump?`<button class="jump" data-t="${s.jump}">${esc(s.branch)} →</button>`:esc(s.branch)}</div>`:"";
 const who=inList?`<span class="who">${s.l==="cust"&&f.cust!=="—"?esc(f.cust):l.name}</span>${s.hand?`<span class="handoff">← ${esc(s.hand)}から引き継ぎ</span>`:""}`:"";
 return `<div class="card" style="--c:var(${l.c})">${who}<b>${esc(s.t)}</b>${s.d?`<p>${esc(s.d)}</p>`:""}${tags?`<div class="tags">${tags}</div>`:""}${br}</div>`;
}
function renderFlow(f){
 let n=0,prev=null;
 f.steps.forEach(s=>{if(s.ph)return;n++;s.n=n;s.hand=(prev&&prev!==s.l)?L[prev].name:null;prev=s.l;});
 const heads=`<div class="mh"></div>`+LANES.map(l=>`<div class="mh"><div class="bar" style="background:var(${l.c})"></div>${l.id==="cust"&&f.cust!=="—"?esc(f.cust):l.name}<small>${l.id==="cust"?"お客様":esc(l.sub)}</small></div>`).join("");
 const rows=f.steps.map(s=>{
  if(s.ph)return `<div class="phase">${esc(s.ph)}</div>`;
  return `<div class="num">${s.n}</div>`+LANES.map((l,i)=>`<div class="cell${i%2?" alt":""}">${l.id===s.l?`<div data-n="${s.n}">${cardHTML(s,f)}</div>`:""}</div>`).join("");
 }).join("");
 const list=f.steps.map(s=>s.ph?`<div class="lphase">${esc(s.ph)}</div>`:`<div class="li" style="--c:var(${L[s.l].c})"><div class="n">${s.n}</div>${cardHTML(s,f,true)}</div>`).join("");
 return `<div class="panel-head"><div><h2>${esc(f.title)}</h2><p>${esc(f.desc)}</p></div>
  <div class="viewsw" role="group" aria-label="表示切替"><button class="btn" id="v-matrix" data-v="matrix">マトリクス</button><button class="btn" id="v-list" data-v="list">手順リスト</button></div></div>
  ${legend()}
  <div class="scroller" id="mx"><div class="matrix" id="matrix">${heads}${rows}<svg class="links" id="links"></svg></div></div>
  <div class="list" id="lst">${list}</div>
  <div class="note ask" style="margin-top:20px"><h4>ヒヤリングで確認すること</h4><ul>${(HEAR[f.id]||[]).map(a=>`<li>${esc(a)}</li>`).join("")}<li>上の図の担当者と順番が、実際と合っているか</li></ul></div>`;
}
function renderOverview(){
 const cards=FLOWS.map(f=>{
  const order=[];f.steps.forEach(s=>{if(!s.ph&&order[order.length-1]!==s.l)order.push(s.l)});
  const chain=order.slice(0,9).map(id=>`<span class="s" style="border-color:var(${L[id].c})">${id==="cust"&&f.cust!=="—"?esc(f.cust):L[id].name}</span>`).join("<i>→</i>");
  const cnt=f.steps.filter(s=>!s.ph).length;
  return `<div class="biz"><h3>${esc(f.title)}</h3><p>${esc(f.desc)}</p><div class="chain">${chain}</div><button class="tab go" data-t="${f.id}">手順を見る（${cnt}ステップ） →</button></div>`;
 }).join("");
 const heads=`<div class="mh"></div>`+LANES.map(l=>`<div class="mh"><div class="bar" style="background:var(${l.c})"></div>${l.name}<small>${esc(l.sub)}</small></div>`).join("");
 const rows=FLOWS.map(f=>{
  const hdr=`<div class="ovgroup"><span>${esc(f.title)}</span><button class="jump" data-t="${f.id}">詳しい手順 →</button></div>`;
  return hdr+OV_FLOW[f.id].map(([lid,label,from],i)=>`<div class="num">${i+1}</div>`+LANES.map((l,j)=>`<div class="cell${j%2?" alt":""}">${l.id===lid?`<div class="node" data-g="${f.id}" data-n="${i+1}"${from?` data-from="${from}"`:""} style="--c:var(${l.c})"><b>${i+1}</b>${esc(label)}</div>`:""}</div>`).join("")).join("");
 }).join("");
 return `<div class="panel-head"><div><h2>全体図</h2><p>5つの業務の流れを、想定で1枚にまとめました。番号と矢印の順に、担当者から担当者へ仕事が引き継がれていきます。</p></div></div>
 ${legend()}
 <div class="scroller"><div class="matrix ov" id="matrix">${heads}${rows}<svg class="links" id="links"></svg></div></div>
 <h3 class="sec" style="margin-top:24px">業務ごとの概要</h3>
 <div class="ov-grid">${cards}</div>
 <div class="notes">
  <div class="note"><h4>業務どうしのつながり</h4><ul>
   <li>ネット販売・祭り受注で在庫がないときは、<b>傘の製造</b>へつながります</li>
   <li>すべての入庫・出庫は<b>在庫Excel</b>に記録し、月1回の棚卸で確かめます</li>
   <li>棚卸の結果から、社長が茶筅、副社長が骨の発注を判断します</li></ul></div>
  <div class="note"><h4>アルバイトさんの担当（想定）</h4><ul>
   <li>受注台帳への入力（電話・ネット・祭り）</li><li>入庫・出庫の在庫Excel入力</li><li>棚卸の実数入力と差異計算</li></ul></div>
  <div class="note ask"><h4>ヒヤリングで確認すること</h4><ul>${ASKS.overview.map(a=>`<li>${esc(a)}</li>`).join("")}<li>各業務ページの「要確認」と確認項目</li></ul></div>
 </div>`;
}
function drawLinks(){
 const mx=$("#matrix"),svg=$("#links");if(!mx||!svg||mx.offsetParent===null)return;
 const base=mx.getBoundingClientRect();
 const all=[...mx.querySelectorAll("[data-n]")];
 const pairs=[];
 all.forEach(b=>{const g=b.dataset.g||"",n=+b.dataset.n,src=b.dataset.from?+b.dataset.from:n-1;
  const a=all.find(x=>(x.dataset.g||"")===g&&+x.dataset.n===src);if(a)pairs.push([a,b]);});
 let d="",heads="";
 for(const [na,nb] of pairs){
  const a=na.getBoundingClientRect(),b=nb.getBoundingClientRect();
  const x1=a.left+a.width/2-base.left,y1=a.bottom-base.top,x2=b.left+b.width/2-base.left,y2=b.top-base.top;
  if(Math.abs(x1-x2)<2){d+=`M${x1},${y1}V${y2-5}`;}
  else{const my=y1+Math.max(8,(y2-y1)/2);d+=`M${x1},${y1}V${my}H${x2}V${y2-5}`;}
  heads+=`<path class="head" d="M${x2-4},${y2-7}L${x2+4},${y2-7}L${x2},${y2}Z"/>`;
 }
 svg.setAttribute("width",mx.scrollWidth);svg.setAttribute("height",mx.scrollHeight);
 svg.innerHTML=`<path d="${d}"/>${heads}`;
}
function applyView(v){
 view=v;store("flowview",v);
 const mx=$("#mx"),ls=$("#lst");if(!mx)return;
 mx.hidden=v!=="matrix";ls.hidden=v!=="list";
 document.querySelectorAll("[data-v]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v));
 requestAnimationFrame(drawLinks);
}
function show(id){
 renderTabs(id);
 const f=FLOWS.find(x=>x.id===id);
 $("#main").innerHTML=f?renderFlow(f):renderOverview();
 if(f)applyView(view||store("flowview")||(innerWidth<760?"list":"matrix"));
 else requestAnimationFrame(drawLinks);
 try{history.replaceState(null,"","#"+id)}catch(e){}
}
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-t]");if(t){show(t.dataset.t);if(t.closest("main"))scrollTo({top:0});return}
 const v=e.target.closest("[data-v]");if(v)applyView(v.dataset.v);
});
addEventListener("resize",()=>requestAnimationFrame(drawLinks));
if(document.fonts)document.fonts.ready.then(drawLinks);
const start=(location.hash||"").slice(1);
show(TABS.some(t=>t.id===start)?start:"overview");
</script>
